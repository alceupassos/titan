[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
; RPO <= 5 minutos via WAL contínuo (docs/adr/0002, seção 4.3 do prompt único).
process-max=2
log-level-console=info

[titan_dev]
pg1-path=/var/lib/postgresql/data
pg1-port=5432

; Produção: repo1 aponta para object storage externo (Contabo Object Storage / R2 / B2),
; nunca só disco local da VPS. Este arquivo é o substituto local para o ensaio de restauração
; (docs/fase-atual.md — gap conhecido, VPS real ainda não provisionada).

[databases]
titan_dev = host=postgres port=5432 dbname=titan_dev

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
; Modo transação é obrigatório (docs/adr/0007) — Next.js multi-processo + workers esgotam
; conexões rapidamente sem ele. Consequência: SET simples (sem LOCAL) vaza contexto de tenant
; entre requisições, porque a conexão física é reciclada entre transações de clientes distintos.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
; Pool pequeno de propósito em dev/teste para FORÇAR compartilhamento de conexão física entre
; "tenants" concorrentes — é o que faz o teste de isolamento (packages/db/test/tenant-isolation)
; detectar vazamento de verdade, em vez de cada requisição por acaso pegar sua própria conexão.

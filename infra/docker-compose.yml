name: titan-stay

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      # `titan` (POSTGRES_USER da imagem oficial) é sempre superusuário — reservado para
      # bootstrap/migrations administrativas, NUNCA usado pela aplicação (achado F-1 da
      # auditoria de segurança de F0: FORCE ROW LEVEL SECURITY não vale para superusuário,
      # então conectar como `titan` no dia a dia deixaria RLS inerte).
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_dev_only}
      POSTGRES_DB: titan_dev
      # Papel não-superusuário que a aplicação/PgBouncer usam de fato — criado por
      # infra/postgres/init/01-app-role.sh no bootstrap do container.
      TITAN_APP_PASSWORD: ${TITAN_APP_PASSWORD:-titan_app_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Regra dura (docs/adr/0007, seção 4.2 do prompt único): PostgreSQL NUNCA publica porta no
    # host em produção. Em dev local, expomos em 127.0.0.1 só para o Testcontainers/psql do
    # desenvolvedor alcançar; nunca 0.0.0.0.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DATABASE_URL define o backend para onde o PgBouncer encaminha (host/porta/db) e nunca
      # aponta para `titan` (superusuário) — só `titan_app`. A AUTENTICAÇÃO real de quem conecta
      # no PgBouncer vem do userlist.txt montado abaixo, não deste env var: o entrypoint do
      # edoburu/pgbouncer só ESCREVE em userlist.txt se ele já existir E o usuário ainda não
      # estiver presente — sem o mount, o arquivo não existe e nada é escrito, e a autenticação
      # falharia silenciosamente. Por isso userlist.txt vem pré-computado e commitado (senha de
      # dev fixa, mesmo padrão já usado em POSTGRES_PASSWORD — nunca um segredo de produção).
      DATABASE_URL: postgres://titan_app:${TITAN_APP_PASSWORD:-titan_app_dev_only}@postgres:5432/titan_dev
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 10
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U titan_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /images
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres_data:
  redis_data:
